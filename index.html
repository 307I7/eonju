<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뭐먹지 - 가벼운 메뉴 추천</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts - Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
      background-color: #fcfcfc;
      color: #111827;
      word-break: keep-all;
    }
    .fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-option {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-option:hover {
      transform: translateY(-1px);
    }
    .card-selected {
      border-color: #111827 !important;
      background-color: #f9fafb !important;
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6">

  <!-- Header -->
  <header class="w-full max-w-md pt-4 pb-2 text-center">
    <button onclick="resetApp()" class="inline-flex items-center gap-2.5 group focus:outline-none">
      <div class="w-9 h-9 rounded-xl bg-black text-white flex items-center justify-center shadow-md group-hover:scale-105 transition-transform">
        <i class="fa-solid font-bold fa-utensils text-sm"></i>
      </div>
      <span class="text-xl font-bold tracking-tight text-gray-900">뭐먹지</span>
    </button>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-md my-auto py-4">

    <!-- STEP 0: Intro View (Black & White Style) -->
    <section id="stepIntro" class="fade-in bg-white p-8 sm:p-10 rounded-3xl border border-gray-200 shadow-sm text-center">
      <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-black text-white flex items-center justify-center text-2xl shadow-sm">
        <i class="fa-solid fa-bowl-food"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight">오늘 뭐 먹지?</h1>
      <p class="text-xs text-gray-500 mt-2 leading-relaxed">
        매일 고통스러운 메뉴 선택의 시간,<br>생각지도 못한 식사 아이디어를 가볍게 제안받아 보세요.
      </p>

      <button onclick="startApp()" class="w-full mt-8 py-4 px-6 bg-black text-white rounded-2xl font-semibold text-sm hover:bg-gray-800 active:scale-98 transition-all flex items-center justify-center gap-2 shadow-md">
        <span>시작하기</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </section>

    <!-- STEP 1: Category Selection -->
    <section id="step1" class="hidden fade-in bg-white p-6 sm:p-8 rounded-3xl border border-gray-200 shadow-sm">
      <div class="text-center mb-6">
        <span class="text-[11px] font-bold tracking-wider uppercase text-gray-700 bg-gray-100 px-3 py-1 rounded-full">1단계</span>
        <h2 class="text-xl font-bold text-gray-900 mt-2.5">어떤 음식이 당기시나요?</h2>
        <p class="text-xs text-gray-400 mt-1">대략적인 음식 카테고리를 골라주세요</p>
      </div>

      <div class="grid grid-cols-1 gap-2.5">
        <button onclick="selectCategory('한식')" class="card-option w-full p-4 rounded-2xl border border-gray-200 text-left flex items-center justify-between hover:border-gray-400 active:bg-gray-50">
          <span class="font-medium text-gray-800 flex items-center gap-3">
            <span class="text-lg">🍚</span> 한식
          </span>
          <i class="fa-solid fa-chevron-right text-xs text-gray-300"></i>
        </button>

        <button onclick="selectCategory('일식')" class="card-option w-full p-4 rounded-2xl border border-gray-200 text-left flex items-center justify-between hover:border-gray-400 active:bg-gray-50">
          <span class="font-medium text-gray-800 flex items-center gap-3">
            <span class="text-lg">🍣</span> 일식
          </span>
          <i class="fa-solid fa-chevron-right text-xs text-gray-300"></i>
        </button>

        <button onclick="selectCategory('중식')" class="card-option w-full p-4 rounded-2xl border border-gray-200 text-left flex items-center justify-between hover:border-gray-400 active:bg-gray-50">
          <span class="font-medium text-gray-800 flex items-center gap-3">
            <span class="text-lg">🥟</span> 중식
          </span>
          <i class="fa-solid fa-chevron-right text-xs text-gray-300"></i>
        </button>

        <button onclick="selectCategory('양식')" class="card-option w-full p-4 rounded-2xl border border-gray-200 text-left flex items-center justify-between hover:border-gray-400 active:bg-gray-50">
          <span class="font-medium text-gray-800 flex items-center gap-3">
            <span class="text-lg">🍝</span> 양식
          </span>
          <i class="fa-solid fa-chevron-right text-xs text-gray-300"></i>
        </button>

        <button onclick="selectCategory('기타')" class="card-option w-full p-4 rounded-2xl border border-gray-200 text-left flex items-center justify-between hover:border-gray-400 active:bg-gray-50">
          <span class="font-medium text-gray-800 flex items-center gap-3">
            <span class="text-lg">🌮</span> 기타 (분식 / 아시안 / 스트리트푸드)
          </span>
          <i class="fa-solid fa-chevron-right text-xs text-gray-300"></i>
        </button>
      </div>
    </section>

    <!-- STEP 2: Food Type Selection -->
    <section id="step2" class="hidden fade-in bg-white p-6 sm:p-8 rounded-3xl border border-gray-200 shadow-sm">
      <div class="flex items-center justify-between mb-4">
        <button onclick="goToStep(1)" class="text-xs text-gray-500 hover:text-gray-900 flex items-center gap-1.5 font-medium">
          <i class="fa-solid fa-arrow-left text-[10px]"></i> 카테고리 변경
        </button>
        <span class="text-[11px] font-bold tracking-wider uppercase text-gray-700 bg-gray-100 px-3 py-1 rounded-full">2단계</span>
      </div>

      <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-gray-900">식사 스타일을 선택해주세요</h2>
        <p id="selectedCategoryBadge" class="text-xs font-medium text-gray-500 mt-1"></p>
      </div>

      <div class="grid grid-cols-1 gap-2.5">
        <button onclick="selectType('밥류')" class="card-option w-full p-4 rounded-2xl border border-gray-200 text-left flex items-center justify-between hover:border-gray-400 active:bg-gray-50">
          <span class="font-medium text-gray-800 flex items-center gap-3">
            <span class="text-lg">🌾</span> 밥류
          </span>
          <i class="fa-solid fa-chevron-right text-xs text-gray-300"></i>
        </button>

        <button onclick="selectType('국류')" class="card-option w-full p-4 rounded-2xl border border-gray-200 text-left flex items-center justify-between hover:border-gray-400 active:bg-gray-50">
          <span class="font-medium text-gray-800 flex items-center gap-3">
            <span class="text-lg">🍲</span> 국류 / 탕류
          </span>
          <i class="fa-solid fa-chevron-right text-xs text-gray-300"></i>
        </button>

        <button onclick="selectType('면류')" class="card-option w-full p-4 rounded-2xl border border-gray-200 text-left flex items-center justify-between hover:border-gray-400 active:bg-gray-50">
          <span class="font-medium text-gray-800 flex items-center gap-3">
            <span class="text-lg">🍜</span> 면류
          </span>
          <i class="fa-solid fa-chevron-right text-xs text-gray-300"></i>
        </button>

        <button onclick="selectType('육류')" class="card-option w-full p-4 rounded-2xl border border-gray-200 text-left flex items-center justify-between hover:border-gray-400 active:bg-gray-50">
          <span class="font-medium text-gray-800 flex items-center gap-3">
            <span class="text-lg">🥩</span> 육류 / 구이 / 볶음
          </span>
          <i class="fa-solid fa-chevron-right text-xs text-gray-300"></i>
        </button>

        <button onclick="selectType('생선류')" class="card-option w-full p-4 rounded-2xl border border-gray-200 text-left flex items-center justify-between hover:border-gray-400 active:bg-gray-50">
          <span class="font-medium text-gray-800 flex items-center gap-3">
            <span class="text-lg">🐟</span> 생선류 / 해산물
          </span>
          <i class="fa-solid fa-chevron-right text-xs text-gray-300"></i>
        </button>
      </div>
    </section>

    <!-- STEP 3: Recommendation Result Screen -->
    <section id="step3" class="hidden fade-in bg-white p-6 sm:p-8 rounded-3xl border border-gray-200 shadow-sm">
      <div class="text-center mb-6">
        <div id="selectionBreadcrumb" class="text-xs text-gray-400 font-medium mb-1"></div>
        <h2 class="text-xl font-bold text-gray-900">이런 메뉴는 어때요?</h2>
        <p class="text-xs text-gray-400 mt-1">2가지 후보 중 마음에 드는 항목을 눌러보세요</p>
      </div>

      <!-- 2 Recommendation Options -->
      <div id="recommendationCards" class="grid grid-cols-1 gap-3.5 mb-5">
        <!-- Dynamically rendered options -->
      </div>

      <!-- Action & Navigation Controls -->
      <div class="space-y-3">
        <!-- Reroll Button -->
        <button onclick="rerollRecommendations()" class="w-full py-3.5 px-4 rounded-2xl bg-black text-white font-medium text-sm flex items-center justify-center gap-2 hover:bg-gray-800 active:scale-98 transition-all shadow-sm">
          <i class="fa-solid fa-rotate-right text-xs"></i>
          다른 메뉴 보기 (다시 돌리기)
        </button>

        <!-- Category Back Controls -->
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="goToStep(2)" class="py-2.5 px-3 rounded-xl border border-gray-200 text-gray-700 font-medium text-xs flex items-center justify-center gap-1.5 hover:bg-gray-50 active:bg-gray-100 transition-colors">
            <i class="fa-solid fa-angles-left text-[10px] text-gray-400"></i>
            유형 변경
          </button>
          <button onclick="goToStep(1)" class="py-2.5 px-3 rounded-xl border border-gray-200 text-gray-700 font-medium text-xs flex items-center justify-center gap-1.5 hover:bg-gray-50 active:bg-gray-100 transition-colors">
            <i class="fa-solid fa-list text-[10px] text-gray-400"></i>
            카테고리 변경
          </button>
        </div>

        <!-- Search Links Container -->
        <div id="searchLinks" class="pt-3 border-t border-gray-100 mt-4 space-y-2">
          <p id="searchTargetText" class="text-xs text-center text-gray-500 font-medium mb-2">
            선택된 메뉴 정보 보기
          </p>

          <div class="grid grid-cols-3 gap-2">
            <button onclick="openSearch('google')" class="py-2.5 px-2 bg-gray-50 border border-gray-200 rounded-xl text-xs font-medium text-gray-800 flex flex-col items-center justify-center gap-1 hover:bg-gray-100 active:scale-95 transition-all">
              <i class="fa-brands fa-google text-gray-700 text-sm"></i>
              이미지 검색
            </button>
            <button onclick="openSearch('naver')" class="py-2.5 px-2 bg-emerald-50 border border-emerald-200 rounded-xl text-xs font-medium text-emerald-800 flex flex-col items-center justify-center gap-1 hover:bg-emerald-100 active:scale-95 transition-all">
              <i class="fa-solid fa-map-location-dot text-emerald-600 text-sm"></i>
              네이버 지도
            </button>
            <button onclick="openSearch('kakao')" class="py-2.5 px-2 bg-amber-50 border border-amber-200 rounded-xl text-xs font-medium text-amber-900 flex flex-col items-center justify-center gap-1 hover:bg-amber-100 active:scale-95 transition-all">
              <i class="fa-solid fa-location-dot text-amber-600 text-sm"></i>
              카카오맵
            </button>
          </div>
        </div>

        <button onclick="resetApp()" class="w-full py-2.5 text-xs text-gray-400 hover:text-gray-700 font-medium text-center transition-colors pt-2 flex items-center justify-center gap-1">
          <i class="fa-solid fa-house text-[10px]"></i> 처음으로 돌아가기
        </button>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="w-full max-w-md py-4 text-center text-xs text-gray-400">
    오늘 먹을 메뉴 고민 해결사 · 뭐먹지
  </footer>

    // App State
    let selectedCategory = '';
    let selectedType = '';
    let currentRecommendations = [];
    let activePickedIndex = 0;

    // DOM References
    const stepIntro = document.getElementById('stepIntro');
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    const selectedCategoryBadge = document.getElementById('selectedCategoryBadge');
    const selectionBreadcrumb = document.getElementById('selectionBreadcrumb');
    const recommendationCards = document.getElementById('recommendationCards');
    const searchTargetText = document.getElementById('searchTargetText');

    // Navigation Switcher
    function goToStep(stepNumber) {
      stepIntro.classList.add('hidden');
      step1.classList.add('hidden');
      step2.classList.add('hidden');
      step3.classList.add('hidden');

      if (stepNumber === 0) {
        stepIntro.classList.remove('hidden');
      } else if (stepNumber === 1) {
        step1.classList.remove('hidden');
      } else if (stepNumber === 2) {
        step2.classList.remove('hidden');
      } else if (stepNumber === 3) {
        step3.classList.remove('hidden');
      }
    }

    function startApp() {
      goToStep(1);
    }

    function selectCategory(category) {
      selectedCategory = category;
      selectedCategoryBadge.textContent = `${selectedCategory} 선택됨`;
      goToStep(2);
    }

    function selectType(type) {
      selectedType = type;
      selectionBreadcrumb.textContent = `${selectedCategory} > ${selectedType}`;
      generateRecommendations();
      goToStep(3);
    }

    // Pick 2 Random Unique Items
    function generateRecommendations() {
      const itemsList = foodDatabase[selectedCategory]?.[selectedType] || [];
      if (itemsList.length < 2) return;

      const shuffled = [...itemsList].sort(() => 0.5 - Math.random());
      currentRecommendations = [shuffled[0], shuffled[1]];
      activePickedIndex = 0;

      renderRecommendationCards();
    }

    function rerollRecommendations() {
      generateRecommendations();
    }

    function pickOption(index) {
      activePickedIndex = index;
      renderRecommendationCards();
    }

    function renderRecommendationCards() {
      recommendationCards.innerHTML = '';

      currentRecommendations.forEach((item, idx) => {
        const isSelected = idx === activePickedIndex;
        const card = document.createElement('div');
        card.className = `card-option border p-4 sm:p-5 rounded-2xl cursor-pointer transition-all flex items-center justify-between ${
          isSelected ? 'card-selected' : 'border-gray-200 bg-white hover:border-gray-300'
        }`;
        
        card.onclick = () => pickOption(idx);

        card.innerHTML = `
          <div class="flex items-center gap-3.5">
            <div class="w-6 h-6 rounded-full border ${isSelected ? 'border-black bg-black text-white' : 'border-gray-300 bg-white'} flex items-center justify-center text-[10px] font-bold transition-all">
              ${isSelected ? '<i class="fa-solid fa-check"></i>' : (idx + 1)}
            </div>
            <div>
              <span class="text-[11px] text-gray-400 block font-medium">추천 ${idx + 1}</span>
              <span class="text-base sm:text-lg font-bold ${isSelected ? 'text-gray-900' : 'text-gray-700'}">${item}</span>
            </div>
          </div>
          <span class="text-xs px-2.5 py-1 rounded-full ${isSelected ? 'bg-black text-white font-medium' : 'text-gray-400 bg-gray-50'}">
            ${isSelected ? '선택됨' : '선택'}
          </span>
        `;

        recommendationCards.appendChild(card);
      });

      const activeFood = currentRecommendations[activePickedIndex];
      searchTargetText.innerHTML = `<span class="text-gray-900 font-bold">'${activeFood}'</span> 검색 및 주변 맛집`;
    }

    // External Search Redirects
    function openSearch(platform) {
      const selectedFood = currentRecommendations[activePickedIndex];
      if (!selectedFood) return;

      let url = '';
      if (platform === 'google') {
        url = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(selectedFood)}`;
      } else if (platform === 'naver') {
        url = `https://map.naver.com/v5/search/${encodeURIComponent(selectedFood + ' 맛집')}`;
      } else if (platform === 'kakao') {
        url = `https://map.kakao.com/?q=${encodeURIComponent(selectedFood + ' 맛집')}`;
      }

      window.open(url, '_blank');
    }

    // Reset Flow
    function resetApp() {
      selectedCategory = '';
      selectedType = '';
      currentRecommendations = [];
      activePickedIndex = 0;
      goToStep(0);
    }
  </script>
