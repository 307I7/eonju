<!DOCTYPE html>
<html lang="ko">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Gowun Dodum & Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #FFF9F2 0%, #FFEEDD 100%);
            min-height: 100vh;
        }
        .font-title {
            font-family: 'Gowun Dodum', cursive, sans-serif;
        }
        .pop-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px -15px rgba(251, 146, 60, 0.15), 0 0 15px rgba(0,0,0,0.03);
        }
        .btn-pop {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-pop:hover {
            transform: translateY(-4px) scale(1.02);
        }
        .btn-pop:active {
            transform: translateY(1px) scale(0.97);
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        .animate-float {
            animation: floatSlow 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="text-gray-800 flex flex-col justify-between items-center p-4 sm:p-6 min-h-screen relative overflow-x-hidden">

            </div>
            <!-- Progress Line -->
            <div class="w-full bg-gray-100 h-2.5 rounded-full overflow-hidden border border-orange-100">

        </div>

                </p>
            </div>

                <i class="fa-solid fa-play text-lg"></i>

            </button>
        </section>

        <section id="step1" class="hidden flex-col items-center justify-center text-center space-y-5 my-auto">

                <h2 class="text-2xl font-bold text-gray-900 font-title mt-1">어떤 종류를 찾으시나요?</h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full pt-2">

            </div>
        </section>

            </div>

                        </a>
                        <a id="kakaoMapLink" href="#" target="_blank" class="flex items-center gap-1.5 px-3 py-1.5 bg-[#FEE500] text-[#191919] text-xs font-bold rounded-xl shadow hover:opacity-90 transition">
                            <i class="fa-solid fa-location-arrow"></i> 카카오 맵

                    </div>
                </div>

                    <i class="fa-solid fa-circle-check"></i>
                    <span>이걸로 결정! (처음으로)</span>
                </button>
            </div>
        </section>

    </main>

    </footer>

        // State Machine
        let currentStep = 0;

        // Navigation Controllers
        function goToStep(step) {
            currentStep = step;
            
            // Hide all sections
            for(let i=0; i<=4; i++) {
                const sec = document.getElementById(`step${i}`);
                if(sec) sec.classList.add('hidden');
                if(sec) sec.classList.remove('flex');
            }

            // Show progress bar for step 1~3
            const progressNav = document.getElementById('progressNav');
            if(step >= 1 && step <= 3) {
                progressNav.classList.remove('hidden');
                updateProgressBar(step);
            } else {
                progressNav.classList.add('hidden');
            }

            // Show active step
            const activeSec = document.getElementById(`step${step}`);
            if(activeSec) {
                activeSec.classList.remove('hidden');
                activeSec.classList.add('flex');
            }
        }

        function updateProgressBar(step) {
            const bar = document.getElementById('progressBar');
            const text = document.getElementById('stepIndicator');
            
            let totalSteps = selectedType === 'meal' ? 3 : 2;
            let currentDisplayStep = step;
            if (selectedType === 'dessert' && step === 2) currentDisplayStep = 2; // Dessert finishes at Step 2 choice

            let percent = (currentDisplayStep / totalSteps) * 100;
            bar.style.width = `${percent}%`;
            text.innerText = `${currentDisplayStep} / ${totalSteps} 단계`;
        }

        function goBack() {
            if (currentStep === 1) {
                goToStep(0);
            } else if (currentStep === 2) {
                goToStep(1);
            } else if (currentStep === 3) {
                goToStep(2);
            }
        }

        }

        // STEP 3: Sub Category Render (Meals only)
        function renderStep3() {
            const grid = document.getElementById('step3Grid');
            grid.innerHTML = '';

            const subCategories = [
                { name: "밥류", emoji: "🍚" },
                { name: "국/찌개류", emoji: "🍲" },
                { name: "면류", emoji: "🍜" },
                { name: "육류", emoji: "🥩" },
                { name: "생선/해산물류", emoji: "🐟" }
            ];

            subCategories.forEach(sub => {
                grid.innerHTML += `
                    <button onclick="selectSubCategory('${sub.name}')" class="btn-pop p-4 bg-white border-2 border-orange-100 hover:border-orange-400 rounded-2xl flex flex-col items-center justify-center text-center shadow-sm">
                        <span class="text-3xl mb-1">${sub.emoji}</span>
                        <span class="font-extrabold text-gray-800 text-sm sm:text-base">${sub.name}</span>
                    </button>
                `;
            });
        }

        function selectSubCategory(subName) {
            selectedSubCategory = subName;
            showResultScreen();
        }

        // STEP 4: Slot Machine & Result logic
        function showResultScreen() {
            goToStep(4);
            rollRandomMenu();
        }

        function getCandidateList() {
            if (selectedType === 'meal') {
                return DATABASE.meal[selectedCategory][selectedSubCategory] || [];
            } else {
                return DATABASE.dessert[selectedCategory] || [];
            }
        }

        function rollRandomMenu() {
            if (isSpinning) return;

            const candidates = getCandidateList();
            if (!candidates || candidates.length === 0) {
                alert("해당 조건의 음식 데이터가 부족합니다.");
                return;
            }

            isSpinning = true;

            // UI State updates
            document.getElementById('spinScreen').classList.remove('hidden');
            document.getElementById('spinScreen').classList.add('flex');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('flex');
            document.getElementById('resultActions').classList.add('hidden');
            document.getElementById('resultActions').classList.remove('flex');

            const spinEmoji = document.getElementById('spinEmoji');
            const spinName = document.getElementById('spinName');
            const spinCategoryTag = document.getElementById('spinCategoryTag');

            let tagText = selectedType === 'meal' 
                ? `${selectedCategory} > ${selectedSubCategory}` 
                : `디저트 > ${selectedCategory}`;
            spinCategoryTag.innerText = tagText;

            let counter = 0;
            let speed = 50;
            const maxSpins = 20;

            function cycle() {
                const randomPick = candidates[Math.floor(Math.random() * candidates.length)];
                spinEmoji.innerText = randomPick.emoji;
                spinName.innerText = randomPick.name;

                counter++;
                if (counter < maxSpins) {
                    if (counter > maxSpins - 6) speed += 50;
                    setTimeout(cycle, speed);
                } else {
                    setTimeout(() => {
                        displayFinalResult(randomPick);
                    }, speed);
                }
            }

            cycle();
        }

        function displayFinalResult(food) {
            currentResultFood = food;
            isSpinning = false;

            // Hide Slot, Show Result
            document.getElementById('spinScreen').classList.add('hidden');
            document.getElementById('spinScreen').classList.remove('flex');

            document.getElementById('resEmoji').innerText = food.emoji;
            document.getElementById('resName').innerText = food.name;
            document.getElementById('resDesc').innerText = `"${food.desc}"`;

            let tagText = selectedType === 'meal' 
                ? `${selectedCategory} • ${selectedSubCategory}` 
                : `디저트 • ${selectedCategory}`;
            document.getElementById('resTags').innerText = tagText;

            // Setup Map Links
            const query = encodeURIComponent(`주변 ${food.name} 맛집`);
            document.getElementById('naverMapLink').href = `https://map.naver.com/v5/search/${query}`;
            document.getElementById('kakaoMapLink').href = `https://map.kakao.com/link/search/${query}`;

            document.getElementById('resultScreen').classList.remove('hidden');
            document.getElementById('resultScreen').classList.add('flex');
            document.getElementById('resultActions').classList.remove('hidden');
            document.getElementById('resultActions').classList.add('flex');
        }

        // Confirm Choice & Celebrate
        function confirmAndReset() {
            // Confetti Explosion
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#f97316', '#fbbf24', '#10b981', '#ec4899', '#3b82f6']
            });

            // Play celebratory sound note via AudioContext
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15); // E5
                osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.3); // G5
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch(e) {}

            // Reset state back to Landing page after short delay
            setTimeout(() => {
                selectedType = null;
                selectedCategory = null;
                selectedSubCategory = null;
                currentResultFood = null;
                goToStep(0);
            }, 1200);
        }

        // Initialize App on Load
        window.onload = function() {
            goToStep(0);
        };
    </script>
</body>
</html>
